<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WGAG</title>
	<link rel="stylesheet" href="css/styles.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
	<header>
			<h1 id="textoDinamico" class="text-center">Buenos días</h1>
			<ul class="nav justify-content-center py-2">
				<li class="nav-item px-3">
					<button class="btn btn-primary btn-sm">Cambiar Tema</button>
				</li>
				<li class="nav-item px-3">
					<button id="btnTamañoTexto" class="btn btn-primary btn-sm">Tamaño Texto</button>
				</li>
				<li class="nav-item px-3">
					<button class="btn btn-primary btn-sm">Leer Página</button>
				</li>
			</ul>
	</header>
	<main>
		<div class="secciones seccion1">
			<p class="p-1">Con este botón podrás cambiar el color de fondo de esta sección</p>
			<div class="p-1">
				<button class="btn btn-sm btn-primary" id="btnCambiaFondoSeccion1">Nuevo Fondo</button>
			</div>
		</div>

		<div class="secciones seccion2">
			<p class="p-1">Contador de clicks</p>
			
			<div class="p-1">
				<button class="btn btn-sm btn-primary" id="btnContadorClicks">Click</button>
			</div>
			<div class="p-1" id="numeroClicks">
				Numero de clicks: 0
			</div>
		</div>
	</main>
	<footer>

	</footer>

	<script src="js/scripts.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</html>
